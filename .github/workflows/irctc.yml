name: IRCTC Automation Booking

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      username:
        description: "IRCTC Username"
        required: true
        type: string
      password:
        description: "IRCTC Password"
        required: true
        type: string
      upi_id:
        description: "UPI ID"
        required: true
        type: string

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  OCR_SERVER_HOST: "127.0.0.1"
  OCR_SERVER_PORT: "5000"
  OCR_SERVER_TIMEOUT: 30

jobs:
  irctc-booking:
    name: IRCTC Booking Automation
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      # -----------------------------------
      # 1. Checkout Repository
      # -----------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------
      # 2. Set System Timezone
      # -----------------------------------
      - name: Set System Timezone
        run: sudo timedatectl set-timezone Asia/Kolkata

      # -----------------------------------
      # 3. Setup Python
      # -----------------------------------
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      # -----------------------------------
      # 4. Install Python Dependencies
      # -----------------------------------
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r irctc-captcha-solver/requirements.txt

      # -----------------------------------
      # 5. Setup Node.js
      # -----------------------------------
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # -----------------------------------
      # 6. Install Node Dependencies
      # -----------------------------------
      - name: Install Node Dependencies
        run: npm ci

      # -----------------------------------
      # 7. Prepare Environment Variables
      # -----------------------------------
      - name: Prepare Environment Variables
        env:
          INPUT_USERNAME: ${{ inputs.username }}
          INPUT_PASSWORD: ${{ inputs.password }}
          INPUT_UPI_ID: ${{ inputs.upi_id }}
          SECRET_USERNAME: ${{ secrets.USERNAME }}
          SECRET_PASSWORD: ${{ secrets.PASSWORD }}
          SECRET_UPI_ID: ${{ secrets.UPI_ID }}
        run: |
          # Use input values if provided (workflow_dispatch), otherwise fall back to secrets
          USERNAME="${INPUT_USERNAME:-$SECRET_USERNAME}"
          PASSWORD="${INPUT_PASSWORD:-$SECRET_PASSWORD}"
          UPI_ID="${INPUT_UPI_ID:-$SECRET_UPI_ID}"

          # Mask sensitive values in logs
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$PASSWORD"
          echo "::add-mask::$UPI_ID"

          # Export to environment
          echo "IRCTC_USERNAME=$USERNAME" >> $GITHUB_ENV
          echo "IRCTC_PASSWORD=$PASSWORD" >> $GITHUB_ENV
          echo "IRCTC_UPI_ID=$UPI_ID" >> $GITHUB_ENV

      # -----------------------------------
      # 8. Start OCR Server
      # -----------------------------------
      - name: Start OCR Server
        run: |
          python irctc-captcha-solver/app-server.py --host 0.0.0.0 --port 5000 &
          
          echo "Waiting for OCR server to be ready..."
          timeout 30 bash -c 'until curl -f http://127.0.0.1:5000 > /dev/null 2>&1; do sleep 1; done' || exit 1
          
          echo "✓ OCR server is ready"

      # -----------------------------------
      # 9. Run Cypress Automation
      # -----------------------------------
      - name: Run Cypress Tests
        run: xvfb-run npx cypress run --browser chrome --env USERNAME=${{ env.IRCTC_USERNAME }},PASSWORD=${{ env.IRCTC_PASSWORD }},UPI_ID=${{ env.IRCTC_UPI_ID }}

      # -----------------------------------
      # 10. Upload Artifacts on Failure
      # -----------------------------------
      - name: Upload Cypress Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 7

      - name: Upload Cypress Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos/
          retention-days: 7

      # -----------------------------------
      # 11. Upload Test Results
      # -----------------------------------
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-results
          path: |
            cypress/results/
            cypress/reports/
          retention-days: 7

      # -----------------------------------
      # 12. Notify on Failure
      # -----------------------------------
      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ IRCTC Automation failed"
          echo "Check artifacts for screenshots and videos"
          exit 1
