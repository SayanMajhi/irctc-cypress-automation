name: IRCTC Automation Booking

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:
    inputs:
      USERNAME:
        description: "IRCTC Username"
        required: true
        type: string

      PASSWORD:
        description: "IRCTC Password"
        required: true
        type: string

      UPI_ID:
        description: "UPI ID"
        required: true
        type: string

jobs:
  IRCTC-Booking:
    runs-on: ubuntu-22.04

    timeout-minutes: 30

    steps:
      # -----------------------------------
      # Checkout Repository
      # -----------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------------
      # Setup Python
      # -----------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # -----------------------------------
      # Install Python Dependencies
      # -----------------------------------
      - name: Install Python Dependencies
        run: |
          sudo timedatectl set-timezone Asia/Kolkata

          python -m pip install --upgrade pip

          pip install -r irctc-captcha-solver/requirements.txt

      # -----------------------------------
      # Setup Node.js
      # -----------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # -----------------------------------
      # Install Node Dependencies
      # -----------------------------------
      - name: Install Node Dependencies
        run: |
          npm install
          npm install -g wait-on

      # -----------------------------------
      # Start Flask OCR Server
      # -----------------------------------
      - name: Start OCR Server
        run: |
          python3 irctc-captcha-solver/app-server.py --host 0.0.0.0 --port 5000 &

          echo "Waiting for OCR server..."

          npx wait-on http://127.0.0.1:5000

          echo "OCR server started successfully."

      # -----------------------------------
      # Prepare Secrets / ENV
      # -----------------------------------
      - name: Prepare Environment Variables
        run: |
          PASSWORD="${{ inputs.PASSWORD || secrets.PASSWORD }}"
          USERNAME="${{ inputs.USERNAME || secrets.USERNAME }}"
          UPI_ID="${{ inputs.UPI_ID || secrets.UPI_ID }}"

          echo "::add-mask::$PASSWORD"
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$UPI_ID"

          echo "PASSWORD=$PASSWORD" >> $GITHUB_ENV
          echo "USERNAME=$USERNAME" >> $GITHUB_ENV
          echo "UPI_ID=$UPI_ID" >> $GITHUB_ENV

      # -----------------------------------
      # Run Cypress Automation
      # -----------------------------------
      - name: Run Cypress Automation
        run: |
          xvfb-run npx cypress run \
            --browser chrome \
            --env UPI_ID=${{ env.UPI_ID }},USERNAME=${{ env.USERNAME }},PASSWORD=${{ env.PASSWORD }}

      # -----------------------------------
      # Upload Screenshots on Failure
      # -----------------------------------
      - name: Upload Cypress Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      # -----------------------------------
      # Upload Cypress Videos
      # -----------------------------------
      - name: Upload Cypress Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
