name: IRCTC Automation Booking

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:
    inputs:
      USERNAME:
        required: true
        type: string
        description: "Your IRCTC Username"

      PASSWORD:
        required: true
        type: string
        description: "Your IRCTC Password"

      UPI_ID:
        required: true
        type: string
        description: "Your UPI ID"

jobs:
  IRCTC-Booking:
    runs-on: ubuntu-22.04

    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------------
      # Python Setup
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          sudo timedatectl set-timezone Asia/Kolkata

          python -m pip install --upgrade pip

          pip install -r irctc-captcha-solver/requirements.txt

      # -------------------------
      # Node.js Setup
      # -------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node Dependencies
        run: |
          npm install
          npm install -g wait-on

      # -------------------------
      # Start Flask Captcha Server
      # -------------------------
      - name: Start Captcha Solver Server
        run: |
          python irctc-captcha-solver/app-server.py --host 0.0.0.0 --port 5000 &

          echo "Waiting for Flask server..."

          npx wait-on http://127.0.0.1:5000

          echo "Flask server started successfully."

      # -------------------------
      # Mask Secrets
      # -------------------------
      - name: Prepare Environment Variables
        run: |
          PASSWORD="${{ inputs.PASSWORD || secrets.PASSWORD }}"
          USERNAME="${{ inputs.USERNAME || secrets.USERNAME }}"
          UPI_ID="${{ inputs.UPI_ID || secrets.UPI_ID }}"

          echo "::add-mask::$PASSWORD"
          echo "::add-mask::$USERNAME"
          echo "::add-mask::$UPI_ID"

          echo "PASSWORD=$PASSWORD" >> $GITHUB_ENV
          echo "USERNAME=$USERNAME" >> $GITHUB_ENV
          echo "UPI_ID=$UPI_ID" >> $GITHUB_ENV

      # -------------------------
      # Run Cypress Automation
      # -------------------------
      - name: Run IRCTC Cypress Automation
        run: |
          xvfb-run npx cypress run \
            --browser chrome \
            --record \
            --key ${{ secrets.CYPRESS_RECORD_KEY }} \
            --env UPI_ID=${{ env.UPI_ID }},USERNAME=${{ env.USERNAME }},PASSWORD=${{ env.PASSWORD }}

      # -------------------------
      # Upload Cypress Screenshots
      # -------------------------
      - name: Upload Cypress Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots

      # -------------------------
      # Upload Cypress Videos
      # -------------------------
      - name: Upload Cypress Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
